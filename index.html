<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you Be My Valentine?</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Music -->
    <audio id="bgMusic" preload="auto" loop>
        <source src="music/love.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Toggle Button -->
    <!-- Text initialized here so it always shows -->
    <button id="musicBtn">Music OFF 🔇</button>


    <!-- MAIN QUESTION -->
    <section class="hero">
        <h1>Will you be my Valentine?</h1>

        <div class="buttons">
            <button id="yesBtn">YES 🥰</button>
            <button id="noBtn">NO 😝</button>
        </div>

        <p id="response"></p>
    </section>


    <!-- SLIDESHOW -->
    <section class="slideshow-section">
        <h2>With My Baby 🥰</h2>

        <div class="slideshow">
            <img id="slide" src="images/photo1.jpg" alt="memory">
            <p id="slideText" class="slide-text">
                Our sweet moment 💖 – Feb 17–18
            </p>

            <div class="controls">
                <button onclick="prevSlide()">⬅ Prev</button>
                <button onclick="nextSlide()">Next ➡</button>
            </div>
        </div>
    </section>


    <!-- POPUP CARD -->
    <div id="popupCard">
        <div id="popupContent">
            <button id="closeCard">✖</button>

            <h2>💌 Valentine's Date Confirmed 💌</h2>

            <p>
                Hi Luna 🥰 <br><br>
                Thank you for saying YES ❤️ <br>
                I'm really excited to spend time with you.
            </p>

            <p>
                📅 Date: February 17–18, 2026 <br>
                ⏰ Time: Whole day together 😌
            </p>

            <p>
                Can't wait to see you 💕
            </p>
        </div>
    </div>


    <!-- Main Script ONLY -->
    <script src="script.js"></script>

</body>
</html>
