<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you Be My Valentine?</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating hearts container -->
    <div id="hearts-container"></div>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="music/love.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Toggle Button -->
    <button id="musicBtn"></button>

    <!-- MAIN QUESTION -->
    <section class="hero">
        <h1>Will you be my Valentine?</h1>

        <div class="buttons">
            <button id="yesBtn">YES 🥰</button>
            <button id="noBtn">NO 😝</button>
        </div>

        <p id="response"></p>
    </section>

    <!-- SLIDESHOW -->
    <section class="slideshow-section">
        <h2>With My Baby 🥰</h2>

        <div class="slideshow">
            <img id="slide" src="images/photo1.jpg" alt="memory">
            <!-- Short message below image -->
            <p id="slideText" class="slide-text">Our sweet moment 💖 – Feb 17–18</p>

            <div class="controls">
                <button onclick="prevSlide()">⬅ Prev</button>
                <button onclick="nextSlide()">Next ➡</button>
            </div>
        </div>
    </section>

    <!-- Script -->
    <script src="script.js"></script>

    <!-- Improved NO button mobile support & YES email -->
    <script>
        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");
        const response = document.getElementById("response");

        function moveNoButton() {
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const maxX = window.innerWidth - btnWidth - 20;
            const maxY = window.innerHeight - btnHeight - 20;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            noBtn.style.position = 'absolute';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function playfulNoText() {
            const originalText = noBtn.textContent;
            noBtn.textContent = "Not so fast! 🤣🤣🤣";
            setTimeout(() => {
                noBtn.textContent = originalText;
            }, 1000);
        }

        // NO button events
        noBtn.addEventListener("mouseover", () => {
            moveNoButton();
            playfulNoText();
        });

        noBtn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            moveNoButton();
            playfulNoText();
        });

        // YES button event
        yesBtn.addEventListener("click", () => {
            response.innerHTML = "Yeheyyy!! ❤️ See you baby sa February 17-18";

            // Open email draft with pre-filled content
            const email = "yourgirlfriend@example.com"; // <-- replace with her email
            const subject = encodeURIComponent("My Valentine Date 😍");
            const body = encodeURIComponent(
                "Hi baby 💖,\n\nExcited to see you on February 17-18! Can't wait for our Valentine date ❤️\n\nLove, [Your Name]"
            );

            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        });
    </script>

</body>
</html>
