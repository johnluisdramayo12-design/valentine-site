<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you Be My Valentine?</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating hearts container -->
    <div id="hearts-container"></div>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="music/love.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Toggle Button -->
    <button id="musicBtn"></button>

    <!-- MAIN QUESTION -->
    <section class="hero">
        <h1>Will you be my Valentine?</h1>

        <div class="buttons">
            <button id="yesBtn">YES ❤️</button>
            <button id="noBtn">NO 💔</button>
        </div>

        <p id="response"></p>
    </section>

    <!-- SLIDESHOW -->
    <section class="slideshow-section">
        <h2>With My Baby 🥰</h2>

        <div class="slideshow">
            <img id="slide" src="images/photo1.jpg" alt="memory">

            <div class="controls">
                <button onclick="prevSlide()">⬅ Prev</button>
                <button onclick="nextSlide()">Next ➡</button>
            </div>
        </div>
    </section>

    <!-- Script -->
    <script src="script.js"></script>

    <!-- Improved NO button mobile support -->
    <script>
        const noBtn = document.getElementById("noBtn");

        function moveNoButton() {
            // Calculate random position within screen boundaries
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const maxX = window.innerWidth - btnWidth - 20; // 20px padding
            const maxY = window.innerHeight - btnHeight - 20;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            noBtn.style.position = 'absolute';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // For desktop hover
        noBtn.addEventListener("mouseover", moveNoButton);

        // For mobile touch devices
        noBtn.addEventListener("touchstart", (e) => {
            e.preventDefault(); // prevent default touch behavior
            moveNoButton();
        });
    </script>

</body>
</html>
